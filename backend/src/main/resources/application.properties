# ====================================================
# SocialConnect API - Configuração de Desenvolvimento
# ====================================================

# Nome da aplicação
spring.application.name=socialconnect-api

# Porta do servidor
server.port=8080

# ===========================================================
# Banco de Dados (H2 em memória para desenvolvimento rápido)
# ===========================================================
spring.datasource.url=jdbc:h2:mem:socialconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / Hibernate
# ==========================================
# Dialeto do H2
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA: Apenas valida, NÃO cria
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open-in-view desligado: o Service já devolve DTO e o Controller nunca
# toca na Entity. Ligado, ele só seguraria a conexão do pool até o JSON
# ser escrito e esconderia erros de carregamento lazy até a produção.
spring.jpa.open-in-view=false

# =========================================================
# Console H2 (Acesso via navegador para inspecionar dados)
# =========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================================
# Flyway (Migrations)
# ==========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# Debug do Flyway (Para garantirmos que ele está rodando)
# ==========================================
logging.level.org.flywaydb=DEBUG

# ==========================================
# SpringDoc OpenAPI / Swagger UI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.open-api.info.title=SocialConnect API
springdoc.open-api.info.description=API RESTful de gestão para instituições sociais
springdoc.open-api.info.version=0.0.1-SNAPSHOT

# ==========================================
# i18n (mensagens de validação e de erro)
# ==========================================
# O Spring Boot cria o MessageSource sozinho ao achar o messages.properties
# (lido em UTF-8). Aqui só fixamos o idioma em pt-BR: assim as mensagens do
# Hibernate Validator sem texto próprio também saem em português, qualquer
# que seja o Accept-Language do cliente ou o idioma da máquina.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
