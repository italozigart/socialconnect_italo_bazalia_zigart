# ==================================================================
# Mensagens da API (i18n) - arquivo em UTF-8
# ==================================================================
# Este é o arquivo padrão (português). Para outro idioma, basta criar
# messages_<idioma>.properties com as mesmas chaves.
#
# Dois tipos de placeholder:
# - Validação (Bean Validation): {max}, {integer}, {fraction} = atributos da anotação.
# - Erros do handler: {0}, {1} = argumentos passados pelo código. Nesses
#   textos o apóstrofo é caractere especial do MessageFormat; não use.

# ---------- Validação: Beneficiário ----------
beneficiario.nome.obrigatorio=O nome é obrigatório.
beneficiario.nome.tamanho=O nome deve ter no máximo {max} caracteres.
beneficiario.nome.vazio=O nome não pode ficar em branco.
beneficiario.cpf.obrigatorio=O CPF é obrigatório.
beneficiario.telefone.tamanho=O telefone deve ter no máximo {max} caracteres.
beneficiario.endereco.tamanho=O endereço deve ter no máximo {max} caracteres.
beneficiario.situacaoVulnerabilidade.tamanho=A situação de vulnerabilidade deve ter no máximo {max} caracteres.

# ---------- Validação: Doador ----------
doador.nome.obrigatorio=O nome é obrigatório.
doador.nome.tamanho=O nome deve ter no máximo {max} caracteres.
doador.tipo.obrigatorio=O tipo é obrigatório: PESSOA_FISICA ou PESSOA_JURIDICA.
doador.email.invalido=E-mail inválido. Use o formato nome@dominio.com.
doador.email.tamanho=O e-mail deve ter no máximo {max} caracteres.

# ---------- Validação: Doação ----------
doacao.idDoador.obrigatorio=O doador é obrigatório: informe o idDoador.
doacao.dataDoacao.obrigatoria=A data da doação é obrigatória.
doacao.valor.positivo=O valor deve ser maior que zero.
doacao.valor.digitos=O valor aceita até {integer} dígitos inteiros e {fraction} casas decimais.
doacao.tipo.obrigatorio=O tipo é obrigatório: ALIMENTO, ROUPA ou FINANCEIRA.
doacao.descricao.tamanho=A descrição deve ter no máximo {max} caracteres.

# ---------- Validação customizada ----------
validacao.cpf.invalido=CPF inválido. Informe os 11 dígitos, sem pontos nem traço.
validacao.telefone.invalido=Telefone inválido. Informe DDD e número, só dígitos: 10 para fixo ou 11 para celular (ex.: 11999999999).

# ---------- Erros (GlobalExceptionHandler) ----------
erro.validacao.titulo=Dados inválidos
erro.validacao.detalhe=Um ou mais campos são inválidos. Veja a lista em errors.

erro.recurso-nao-encontrado.titulo=Recurso não encontrado
# Sem gênero ("não existe"): o mesmo texto serve para Beneficiário e Doador
# (masculinos) e para Doação (feminino). Com "não encontrado", a doação
# sairia "Doação com id 99 não encontrado.".
erro.recurso-nao-encontrado.detalhe={0} com id {1} não existe.

erro.cpf-duplicado.titulo=CPF já cadastrado
erro.cpf-duplicado.detalhe=Já existe um beneficiário com o CPF {0}.

erro.corpo-invalido.titulo=Corpo da requisição inválido
erro.corpo-invalido.detalhe=O JSON está malformado ou algum campo tem tipo ou valor não aceito.

erro.parametro-invalido.titulo=Parâmetro inválido
erro.parametro-invalido.detalhe=O parâmetro "{0}" não aceita o valor "{1}".
erro.parametro-invalido.valores=Valores aceitos: {0}.

erro.ordenacao-invalida.titulo=Ordenação inválida
# Sem sugerir um atributo: "como nome" não serve para a doação, que não tem nome.
erro.ordenacao-invalida.detalhe=Não é possível ordenar por "{0}": o recurso não tem esse atributo.

erro.endpoint-nao-encontrado.titulo=Endpoint não encontrado
erro.endpoint-nao-encontrado.detalhe=O caminho {0} não existe na API.

erro.metodo-nao-suportado.titulo=Método não suportado
erro.metodo-nao-suportado.detalhe=O método {0} não é aceito neste endereço.

erro.tipo-midia.titulo=Tipo de conteúdo não suportado
erro.tipo-midia.detalhe=Envie o corpo com o cabeçalho Content-Type: application/json.

erro.interno.titulo=Erro interno do servidor
erro.interno.detalhe=Ocorreu um erro inesperado. Tente novamente mais tarde.
