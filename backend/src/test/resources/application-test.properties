# ====================================================
# SocialConnect API - Perfil de teste
# ====================================================
# Carregado só nas classes com @ActiveProfiles("test"). Complementa o
# src/main/resources/application.properties: as chaves daqui substituem as
# de lá, e o resto (H2 em memória, Flyway, ddl-auto=validate, locale pt-BR)
# continua valendo. Sem Docker: os testes usam o mesmo H2 em memória.
#
# O nome precisa ter o "-test": um application.properties aqui em
# src/test/resources esconderia o de src/main/resources nos testes.

# Log enxuto: sem o SQL de cada requisição e sem o DEBUG do Flyway
# (as linhas INFO da migration continuam aparecendo).
spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO

# Console do H2 desligado: nenhum teste usa.
spring.h2.console.enabled=false
