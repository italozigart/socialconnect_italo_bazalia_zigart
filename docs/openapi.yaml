# Contrato da SocialConnect API (base: repositório do professor).
# Etapa 5 (issue #7): a parte de Beneficiários foi alinhada à API implementada.
# - JSON em camelCase, como os records Java e os exemplos das Aulas 05 e 06
#   (o prefixo id_ da disciplina vale para as colunas do banco).
# - Parâmetro de caminho {idBeneficiario}; a URL continua /api/v1/beneficiarios/1.
# - CPF só com 11 dígitos: ^\d{14}$ eram 14 dígitos, e não o CPF com máscara.
# - Respostas 400 e 409 que faltavam. O 500 (erro inesperado) fica só no Swagger.
# Etapa 7 (issue #9): a parte de Doadores foi alinhada à API, nos mesmos moldes.
# - JSON em camelCase (idDoador) e parâmetro de caminho {idDoador}.
# - GET por id, que o Location do POST aponta, e as respostas 400 e 404.
# - DoadorRequest com os limites da V3: e-mail até 254 e telefone só com dígitos.
# Etapa 8 (issue #17): a parte de Doações foi alinhada à API, nos mesmos moldes.
# - JSON em camelCase (idDoacao, idDoador, dataDoacao) e parâmetro {idDoacao}.
# - GET por id, Location no 201 e as respostas 400, 404 e 422 (doador
#   inexistente: decisão em docs/adr/0001-doador-inexistente.md).
# - DoacaoResponse com a descricao, e PageDoacaoResponse com first e last.
# Etapa 9 (issue #18): PUT, PATCH e DELETE em /api/v1/doacoes/{idDoacao}.
# - PUT com o DoacaoRequest do POST (substituição total) e PATCH com o novo
#   DoacaoPatch (só os campos enviados e não nulos mudam).
# - Respostas 400, 404 e 422; o 422 (doador inexistente) vale agora também no
#   PUT e no PATCH. DELETE com 204, 400 e 404.
# Etapa 10 (issue #19): o front-end (frontend/) consome a listagem de beneficiários.
# - BeneficiarioResponse: telefone, endereco e situacaoVulnerabilidade como
#   [string, 'null'], porque a API devolve null quando não foram informados.
# - BeneficiarioResponse e PageBeneficiarioResponse com required: os campos vêm
#   sempre no JSON (mesmo com null). Os tipos Beneficiario e Page<T> do front
#   seguem estes dois schemas.
# Etapa 11 (issue #20): o telefone do beneficiário passa a usar a @Telefone do
# doador, e o formulário de cadastro do front-end (Zod) confere o mesmo formato.
# - BeneficiarioRequest e BeneficiarioPatch: telefone só com dígitos, 10 (fixo)
#   ou 11 (celular), no lugar do maxLength 20. A API ainda confere o DDD (11 a
#   99) e o início do número (fixo de 2 a 5, celular com 9), que o pattern não
#   expressa.
# - No PATCH, telefone em branco ("") apaga o telefone. No POST, no PUT e no
#   PATCH, o telefone em branco é gravado como null.
# Produtos mantém o texto original até ser implementado.
openapi: 3.1.0
info:
  title: SocialConnect API
  description: API RESTful de gestão para instituições sociais (Disciplina - Tópicos Especiais em Sistemas para Internet III).
  version: 0.5.0
  contact:
    name: Prof. James Campos
    email: james.campos@cps.sp.gov.br

servers:
  - url: http://localhost:8080
    description: Servidor de Desenvolvimento Local

tags:
  - name: Beneficiários
    description: Gestão de beneficiários
  - name: Doações
    description: Gestão de doações
  - name: Doadores
    description: Gestão de doadores
  - name: Produtos
    description: Gestão de produtos

paths:
  /api/v1/beneficiarios:
    get:
      tags:
        - Beneficiários
      summary: Lista beneficiários com paginação e filtros
      operationId: listarBeneficiarios
      parameters:
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: cpf
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de beneficiários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBeneficiarioResponse'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags:
        - Beneficiários
      summary: Cria um novo beneficiário
      operationId: criarBeneficiario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiarioRequest'
      responses:
        '201':
          description: Beneficiário criado com sucesso
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiarioResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: CPF já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/beneficiarios/{idBeneficiario}:
    get:
      tags:
        - Beneficiários
      summary: Busca um beneficiário por ID
      operationId: buscarBeneficiarioPorId
      parameters:
        - name: idBeneficiario
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Dados do beneficiário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiarioResponse'
        '400':
          description: Id inválido (não numérico ou acima do limite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Beneficiário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags:
        - Beneficiários
      summary: Atualiza um beneficiário (substituição total)
      operationId: atualizarBeneficiario
      parameters:
        - name: idBeneficiario
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiarioRequest'
      responses:
        '200':
          description: Beneficiário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiarioResponse'
        '400':
          description: Dados inválidos, JSON malformado ou id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Beneficiário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Outro beneficiário já usa este CPF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      tags:
        - Beneficiários
      summary: Atualiza parcialmente um beneficiário
      operationId: atualizarParcialmenteBeneficiario
      parameters:
        - name: idBeneficiario
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiarioPatch'
      responses:
        '200':
          description: Beneficiário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiarioResponse'
        '400':
          description: Dados inválidos, JSON malformado ou id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Beneficiário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags:
        - Beneficiários
      summary: Remove um beneficiário
      operationId: deletarBeneficiario
      parameters:
        - name: idBeneficiario
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Beneficiário removido com sucesso
        '400':
          description: Id inválido (não numérico ou acima do limite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Beneficiário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/doacoes:
    get:
      tags:
        - Doações
      summary: Lista doações com paginação e filtros
      operationId: listarDoacoes
      parameters:
        - name: dataInicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dataFim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: tipo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TipoDoacao'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de doações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDoacaoResponse'
        '400':
          description: Período invertido, data ou tipo inválidos, ou ordenação por atributo inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags:
        - Doações
      summary: Registra uma nova doação
      operationId: criarDoacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoacaoRequest'
      responses:
        '201':
          description: Doação registrada com sucesso
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoacaoResponse'
        '400':
          description: Dados inválidos, tipo fora da lista ou JSON malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Doador inexistente (o idDoador não é de nenhum doador cadastrado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/doacoes/{idDoacao}:
    get:
      tags:
        - Doações
      summary: Busca uma doação por ID
      operationId: buscarDoacaoPorId
      parameters:
        - name: idDoacao
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Dados da doação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoacaoResponse'
        '400':
          description: Id inválido (não numérico ou acima do limite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Doação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags:
        - Doações
      summary: Atualiza uma doação (substituição total)
      operationId: atualizarDoacao
      parameters:
        - name: idDoacao
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoacaoRequest'
      responses:
        '200':
          description: Doação atualizada (valor e descricao ausentes no JSON viram null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoacaoResponse'
        '400':
          description: Dados inválidos, tipo fora da lista, JSON malformado ou id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Doação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Doador inexistente (o idDoador não é de nenhum doador cadastrado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      tags:
        - Doações
      summary: Atualiza parcialmente uma doação
      operationId: atualizarParcialmenteDoacao
      parameters:
        - name: idDoacao
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoacaoPatch'
      responses:
        '200':
          description: Doação atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoacaoResponse'
        '400':
          description: Campo inválido, tipo fora da lista, JSON malformado ou id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Doação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Doador inexistente (o idDoador enviado não é de nenhum doador cadastrado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags:
        - Doações
      summary: Remove uma doação
      operationId: deletarDoacao
      parameters:
        - name: idDoacao
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Doação removida com sucesso (o doador continua cadastrado)
        '400':
          description: Id inválido (não numérico ou acima do limite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Doação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/doadores:
    get:
      tags:
        - Doadores
      summary: Lista doadores com paginação
      operationId: listarDoadores
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de doadores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDoadorResponse'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags:
        - Doadores
      summary: Cria um novo doador
      operationId: criarDoador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoadorRequest'
      responses:
        '201':
          description: Doador criado com sucesso
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoadorResponse'
        '400':
          description: Dados inválidos, tipo fora da lista ou JSON malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/doadores/{idDoador}:
    get:
      tags:
        - Doadores
      summary: Busca um doador por ID
      operationId: buscarDoadorPorId
      parameters:
        - name: idDoador
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Dados do doador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoadorResponse'
        '400':
          description: Id inválido (não numérico ou acima do limite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Doador não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/produtos:
    get:
      tags:
        - Produtos
      summary: Lista produtos com paginação
      operationId: listarProdutos
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista paginada de produtos
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProdutoResponse'
    post:
      tags:
        - Produtos
      summary: Cria um novo produto
      operationId: criarProduto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoRequest'
      responses:
        '201':
          description: Produto criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponse'

components:
  schemas:
    BeneficiarioRequest:
      type: object
      required:
        - nome
        - cpf
      properties:
        nome:
          type: string
          maxLength: 150
        cpf:
          type: string
          pattern: ^\d{11}$
        telefone:
          type: string
          pattern: ^\d{10,11}$
          description: Opcional. DDD e número, só dígitos (10 para fixo, 11 para celular)
        endereco:
          type: string
          maxLength: 255
        situacaoVulnerabilidade:
          type: string
          maxLength: 500

    BeneficiarioResponse:
      type: object
      required:
        - idBeneficiario
        - nome
        - cpf
        - telefone
        - endereco
        - situacaoVulnerabilidade
        - dataCadastro
      properties:
        idBeneficiario:
          type: integer
          format: int64
        nome:
          type: string
        cpf:
          type: string
        telefone:
          type: [string, 'null']
          description: Vem null quando não foi informado no cadastro
        endereco:
          type: [string, 'null']
          description: Vem null quando não foi informado no cadastro
        situacaoVulnerabilidade:
          type: [string, 'null']
          description: Vem null quando não foi informada no cadastro
        dataCadastro:
          type: string
          format: date

    BeneficiarioPatch:
      type: object
      properties:
        nome:
          type: string
          maxLength: 150
        telefone:
          type: string
          pattern: ^(\d{10,11})?$
          description: DDD e número, só dígitos (10 para fixo, 11 para celular); em branco (""), apaga o telefone
        endereco:
          type: string
          maxLength: 255
        situacaoVulnerabilidade:
          type: string
          maxLength: 500

    PageBeneficiarioResponse:
      type: object
      required:
        - content
        - totalElements
        - totalPages
        - first
        - last
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BeneficiarioResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    TipoDoacao:
      type: string
      enum:
        - ALIMENTO
        - ROUPA
        - FINANCEIRA

    DoacaoRequest:
      type: object
      required:
        - idDoador
        - dataDoacao
        - tipo
      properties:
        idDoador:
          type: integer
          format: int64
        dataDoacao:
          type: string
          format: date
          description: Hoje ou uma data passada
        valor:
          type: number
          format: decimal
          exclusiveMinimum: 0
          maximum: 99999999.99
          description: Opcional. Maior que zero, com até 2 casas decimais
        tipo:
          $ref: '#/components/schemas/TipoDoacao'
        descricao:
          type: string
          maxLength: 500

    DoacaoPatch:
      type: object
      description: Só os campos enviados e não nulos mudam. Descrição em branco apaga a descrição; para apagar o valor, use o PUT.
      properties:
        idDoador:
          type: integer
          format: int64
          description: Se vier, precisa ser de um doador cadastrado
        dataDoacao:
          type: string
          format: date
          description: Hoje ou uma data passada
        valor:
          type: number
          format: decimal
          exclusiveMinimum: 0
          maximum: 99999999.99
          description: Maior que zero, com até 2 casas decimais
        tipo:
          $ref: '#/components/schemas/TipoDoacao'
        descricao:
          type: string
          maxLength: 500

    DoacaoResponse:
      type: object
      properties:
        idDoacao:
          type: integer
          format: int64
        idDoador:
          type: integer
          format: int64
        dataDoacao:
          type: string
          format: date
        valor:
          type: number
          format: decimal
        tipo:
          $ref: '#/components/schemas/TipoDoacao'
        descricao:
          type: string

    PageDoacaoResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DoacaoResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    TipoDoador:
      type: string
      enum:
        - PESSOA_FISICA
        - PESSOA_JURIDICA

    DoadorRequest:
      type: object
      required:
        - nome
        - tipo
      properties:
        nome:
          type: string
          maxLength: 200
        tipo:
          $ref: '#/components/schemas/TipoDoador'
        email:
          type: string
          format: email
          maxLength: 254
        telefone:
          type: string
          pattern: ^\d{10,11}$

    DoadorResponse:
      type: object
      properties:
        idDoador:
          type: integer
          format: int64
        nome:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoDoador'
        email:
          type: string
        telefone:
          type: string

    PageDoadorResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DoadorResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    CategoriaProduto:
      type: string
      enum:
        - ALIMENTO
        - ROUPA
        - HIGIENE
        - OUTROS

    ProdutoRequest:
      type: object
      required:
        - nome
        - categoria
        - estoque_minimo
      properties:
        nome:
          type: string
          maxLength: 150
        categoria:
          $ref: '#/components/schemas/CategoriaProduto'
        estoque_minimo:
          type: integer
          minimum: 0
        unidade_medida:
          type: string
          maxLength: 20

    ProdutoResponse:
      type: object
      properties:
        id_produto:
          type: integer
          format: int64
        nome:
          type: string
        categoria:
          $ref: '#/components/schemas/CategoriaProduto'
        estoque_atual:
          type: integer
        estoque_minimo:
          type: integer
        unidade_medida:
          type: string

    ProblemDetail:
      type: object
      description: Estrutura padronizada para erros (RFC 7807)
